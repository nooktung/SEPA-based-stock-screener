# Market themes ("sóng ngành") the user follows, as ticker lists.
#
# Vietstock's industry tree is too coarse for these: rubber growers sit in
# "Hóa chất" with fertiliser and plastics, ports sit in "Hạ tầng giao thông"
# with airports and toll roads. A theme here is a user-curated group; the
# screen measures each one (group RS, 1- and 3-month returns, share of members
# above MA50) and puts the uptrending members of a strong theme first in the
# extended watch list. Edit freely: add a theme, add or remove tickers. Only
# members that clear the liquidity floor are measured.
#
# Added 2026-09-30 at the user's request (oil & gas, rubber, ports).

